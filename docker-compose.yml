version: "3.8"

services:
  web:
    build: .
    ports:
      - "${FLASK_PORT:-5000}:5000"
    volumes:
      - ./params.yaml:/app/params.yaml
      - ./data:/app/data
      - ./data_given:/app/data_given
      - ./saved_models:/app/saved_models
      - ./prediction_service/model:/app/prediction_service/model
      - ./report:/app/report
    env_file:
      - .env
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
